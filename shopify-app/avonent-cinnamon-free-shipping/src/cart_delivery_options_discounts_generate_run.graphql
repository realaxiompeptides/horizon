query DeliveryInput {
  cart {
    lines {
      quantity
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
    deliveryGroups {
      id
    }
  }
  discount {
    discountClasses
  }
}
